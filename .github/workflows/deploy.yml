# Builds the site and publishes it to GitHub Pages.
# Runs on every push to main, every Monday (so the Play install counts stay fresh) and on demand.
name: Deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * 1' # Monday 09:00 IST
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # prebuild refreshes src/data/play-stats.json from Google Play, keeping saved numbers if Play is unreachable.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
